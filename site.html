<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D-Gantt site: BIM + drawings</title>
  <style>:root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#e3e6ea;--panel:#f6f8fa;--accent:#2f6fdf}@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e6e8eb;--muted:#9aa3ad;--line:#2b3038;--panel:#1d2027;--accent:#6ea2ff}}html,body{background:var(--bg);height:100%;color:var(--fg);margin:0;font:13px system-ui,sans-serif}body{flex-direction:column;display:flex}header{border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;gap:14px;padding:8px 12px;display:flex}header label{align-items:center;gap:6px;display:flex}#at{width:220px}.legend{color:var(--muted);gap:10px;display:flex}.legend i,.chip i{vertical-align:-1px;border-radius:2px;width:10px;height:10px;margin-right:4px;display:inline-block}#status{color:var(--accent);margin-left:auto}main{flex:1;grid-template-rows:44% 1fr;grid-template-columns:1fr 1fr 320px;min-height:0;display:grid}#gantt{border-bottom:1px solid var(--line);grid-column:1/3;min-height:0}section.pane{flex-direction:column;min-width:0;min-height:0;display:flex}section.pane+section.pane{border-left:1px solid var(--line)}.bar{border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;display:flex}.bar strong{margin-right:4px}.bar button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}#bim3d,#viewer{flex:1;min-height:0;position:relative}#bim3d{color:var(--fg)}aside{border-left:1px solid var(--line);background:var(--panel);grid-area:1/3/3;padding:10px 12px;overflow:auto}aside h3{text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px;font-size:12px}aside h2{margin:0 0 4px;font-size:15px}aside .muted{color:var(--muted)}.chips{flex-wrap:wrap;gap:4px;margin-bottom:6px;display:flex}.chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;align-items:center;gap:4px;padding:2px 6px;display:inline-flex}.chip button{color:var(--muted);cursor:pointer;font:inherit;background:0 0;border:0;padding:0 2px}aside select,aside input[type=text]{box-sizing:border-box;width:100%;margin:2px 0 6px}aside ul{margin:0;padding-left:16px}aside li{margin:2px 0}.link{color:var(--accent);cursor:pointer;font:inherit;text-align:left;background:0 0;border:0;padding:0}</style>
  <script type="module" crossorigin src="./assets/site-BSQLNO41.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/gantt-CMhVHQkb.js">
  <link rel="modulepreload" crossorigin href="./assets/site-data-DxOcvsjn.js">
  <link rel="modulepreload" crossorigin href="./assets/drawings-BdM0BMJT.js">
</head>
<body>
  <header>
    <strong>Riverside Residences · schedule · 3D · drawings</strong>
    <label>Status on <input id="at" type="range" step="86400000"> <span id="atLabel"></span></label>
    <span class="legend">
      <span><i style="background:#9aa7b8"></i>not started</span><span><i style="background:#4c8bf5"></i>in progress</span>
      <span><i style="background:#2e9e5b"></i>done</span><span><i style="background:#e5484d"></i>late</span><span><i style="background:#f59e0b"></i>selected</span>
    </span>
    <span id="status" aria-live="polite"></span>
    <button id="reset" type="button">Reset demo</button>
  </header>
  <main>
    <div id="gantt"></div>
    <section class="pane">
      <div class="bar">
        <strong>3D model</strong>
        <select id="floor" aria-label="Floor"><option value="">All floors</option></select>
        <button id="useLayout" type="button" title="Use unit and core outlines marked on the open drawing">Layout from drawing</button>
        <button id="genLayout" type="button">Generated layout</button>
        <button id="fit3d" type="button">Fit</button>
      </div>
      <div id="bim3d"></div>
    </section>
    <section class="pane">
      <div class="bar">
        <strong>Drawing</strong>
        <select id="drawing" aria-label="Drawing"></select>
        <input id="upload" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.svg,.dxf,.dwg" hidden><button id="uploadBtn" type="button">Upload…</button>
        <span role="group" aria-label="Tool">
          <button type="button" data-tool="select" aria-pressed="true">Select</button>
          <button type="button" data-tool="rect">Rect</button>
          <button type="button" data-tool="polygon">Polygon</button>
          <button type="button" data-tool="pin">Pin</button>
          <button type="button" data-tool="calibrate" title="Click two points a known distance apart">Calibrate</button>
        </span>
        <button id="prev" type="button" aria-label="Previous page">‹</button><span id="pageLabel"></span><button id="next" type="button" aria-label="Next page">›</button>
        <button id="fit2d" type="button">Fit</button>
      </div>
      <div id="viewer"></div>
    </section>
    <aside id="panel"></aside>
  </main>
</body>
</html>
